name: ELF

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  elf:
    runs-on: ubuntu-latest
    env:
      # Match the toolchain that produced the checked-in ELFs.
      SP1_VERSION: "6.3.1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install SP1 toolchain
        env:
          # sp1up queries api.github.com; unauthenticated calls get rate-limited on shared runners
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L https://sp1.succinct.xyz | bash
          ~/.sp1/bin/sp1up --version "$SP1_VERSION"
          ~/.sp1/bin/cargo-prove prove --version
          source ~/.bashrc
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify the SP1 Helios Binary
        run: |
          # Build the binaries
          cd program
          ~/.sp1/bin/cargo-prove prove build --docker --tag "v$SP1_VERSION" --locked --output-directory ../elf
          cd ../

          # Check for any changes in the elf directory
          if [ -n "$(git status --porcelain elf/)" ]; then
            echo "❌ ELF files changed during build!"
            git diff elf/
            exit 1
          else
            echo "✅ ELF files remained unchanged"
          fi
